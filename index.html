<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f3f4f6 50%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #111827;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12), 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    h1 { font-size: 26px; margin-bottom: 6px; letter-spacing: -0.02em; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; }

    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 60px; }

    .toggle {
      position: absolute;
      right: 8px;
      top: 4px;
      width: auto;
      padding: 6px 8px;
      background: none;
      color: #6b7280;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
    }

    .toggle:hover { background: #f3f4f6; color: #111827; }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .row label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }

    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }

    button {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover { background: #1d4ed8; }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.35); outline-offset: 2px; }

    .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; min-height: 16px; }

    .footer { text-align: center; font-size: 14px; color: #6b7280; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back! Please enter your details.</p>

    <form id="signin-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle-password" aria-label="Show password">Show</button>
      </div>

      <div class="row">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <p class="error" id="error"></p>

      <button type="submit">Sign in</button>
    </form>

    <p class="footer">Don't have an account? <a href="#">Sign up</a></p>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("toggle-password");
    toggleBtn.addEventListener("click", function () {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      toggleBtn.textContent = show ? "Hide" : "Show";
      toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    document.getElementById("signin-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (!email || !password) {
        error.textContent = "Please fill in both fields.";
      } else if (!/^\S+@\S+\.\S+$/.test(email)) {
        error.textContent = "Please enter a valid email address.";
      } else {
        error.textContent = "";
        alert("Signed in as " + email);
      }
    });
  </script>
</body>
</html>
