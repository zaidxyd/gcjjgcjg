<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #111827;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    h1 { font-size: 24px; margin-bottom: 6px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; }

    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .row label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }

    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }

    button {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; min-height: 16px; }

    .footer { text-align: center; font-size: 14px; color: #6b7280; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back! Please enter your details.</p>

    <form id="signin-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>

      <div class="row">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <p class="error" id="error"></p>

      <button type="submit">Sign in</button>
    </form>

    <p class="footer">Don't have an account? <a href="#">Sign up</a></p>
  </main>

  <script>
    document.getElementById("signin-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (!email || !password) {
        error.textContent = "Please fill in both fields.";
      } else if (!/^\S+@\S+\.\S+$/.test(email)) {
        error.textContent = "Please enter a valid email address.";
      } else {
        error.textContent = "";
        alert("Signed in as " + email);
      }
    });
  </script>
</body>
</html>
